<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS Sandbox</title>
  </head>
  <body>
    <h1>HTML & CSS Sandbox - iframe</h1>

    <!-- Embedded Webpage -->
    <iframe src="./test.html" frameborder="0" width="600" height="400"></iframe>

    <!-- YouTube Video -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/lecITZkWqzg?si=3vx6hQ2_B1uzcBEF"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <!-- PDF -->
    <iframe
     src="./invoicesample.pdf"
      width="600"
      height="315"
      frameborder="0"
    >
    </iframe>

    <!-- Google Maps -->
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3650.080353881402!2d90.39092681498152!3d23.812345284558996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755c7d067ec2895%3A0x5f3dd915b97b4a4e!2sDhaka!5e0!3m2!1sen!2sbd!4v1629286543728!5m2!1sen!2sbd"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    >
    </iframe>
     <iframe 
    src="https://calendar.google.com/calendar/embed?src=youremail%40gmail.com&ctz=Asia%2FDhaka" 
    style="border: 0" 
    width="800" 
    height="600" 
    frameborder="0" 
    scrolling="no">
  </iframe>
  </body>
</html>
