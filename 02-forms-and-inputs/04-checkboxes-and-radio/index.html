<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS Sandbox</title>
  </head>
  <body>
   <h2>Favourite Programming Languages</h2>
   <form>
    <label for="html">
      <input type="checkbox" checked name="languages" id="html" />HTML
    </label>
    <label for="css">
      <input type="checkbox"  disabledname="languages" id="css" />CSS
    </label>
    <label for="javaScript">
      <input type="checkbox" checked name="languages" 
      id="javascript" />JavaScript
    </label>
    
      



   </form>
   <h2>Product Size</h2>
   <form>
    <label for="small">
      <input type="radio" name="size"
       id="small" value="small" checked />Small
    </label>
     <label for="medium">
      <input type="radio" name="size"
       id="medium" value="medium"  />Medium
    </label>
     <label for="large">
      <input type="radio" name="size"
       id="large" value="large"  />Large
    </label>
   </form>
  </body>
</html>
