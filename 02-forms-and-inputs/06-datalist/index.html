<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS Sandbox</title>
  </head>
  <body>
    <h1>HTML & CSS Sandbox - Datalist</h1>
    <!--General List select-->
    <label for="favLanguage">Favourite Programming Languages</label>
    <input list="languages" 
    id="favLanguage" name="favLanguage" />
    <datalist id="languages">
      <option value="JavaScript">
      <option value="Python">
      <option value="Java">
      <option value="C++">
      <option value="Ruby">
      <option value="PHP">
      <option value="Swift">
      <option value="Go">
      <option value="Kotlin">
      <option value="Rust"> 

    </datalist>
    <br />
    <input type="time" list="'popularHours'"  >
    <datalist id ="popularHours">
      <option value="08:00">
      <option value="09:00">
      <option value="10:00">
      <option value="11:00">
      <option value="12:00">
      <option value="13:00">
      <option value="14:00">
      <option value="15:00">
      <option value="16:00">
      <option value="17:00">
    </datalist>
    <label for="tick" >Tip Amount</label>
    <input type="range" id="tick" name="tick" 
    list="tickmarks" min="0" max="100" />
    <datalist id="tickmarks">
      <option value="0">
      <option value="10">
      <option value="20" >
      <option value="30" >
      <option value="40" >
      <option value="50">
      <option value="60" >
      <option value="70" >
      <option value="80" >
      <option value="90" >
      <option value="100" >

    </datalist>
    <label for="colors"> Pick a Color</label>
    <input type="color" name="colors" id="colors" list="redColors" >
    <datalist id="redColors" >
      <option value="#800000"></option>
       <option value="#8B0000"></option>
        <option value="#A52A2A"></option>
        <option value="#DC143C"></option>
    </datalist>
  </body>
</html>
